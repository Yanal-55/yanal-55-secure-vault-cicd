<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault CI/CD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Secure Vault CI/CD Application</h1>

    <p>
        Full-stack application using Docker, PostgreSQL,
        HashiCorp Vault and GitHub Actions.
    </p>

    <div class="card">
        <h2>Backend Status</h2>

        <button onclick="checkBackend()">
            Check Backend
        </button>

        <div id="result"></div>
    </div>

<script>
async function checkBackend() {
    const result = document.getElementById("result");

    try {
        const response = await fetch("/api/health");
        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
    } catch (error) {
        result.textContent = "Backend connection failed.";
    }
}
</script>

</body>
</html>
